# ==================
# KEYBINDINGS
# ==================

# SwayOSD
# --- SwayOSD Volume & Brightness ---
bindl = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindl = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindl = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# --- SwayOSD Media Controls ---
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause

# --- SwayOSD CapsLock/NumLock ---
bindr = CAPS, Caps_Lock, exec, swayosd-client --caps-lock

# Workspaces
# -- Switch to specific workspace --
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# -- Move active window to specific workspace --
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# -- Relative workspace jumping (Scroll/Next/Prev) --
bind = SUPER, U, workspace, e+1
bind = SUPER, I, workspace, e-1

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bind = SUPER CTRL, mouse_down, movetoworkspace, e+1
bind = SUPER CTRL, mouse_up, movetoworkspace, e-1

bind = SUPER SHIFT, I, movetoworkspace, e-1
bind = SUPER SHIFT, U, movetoworkspace, e+1

bind = SUPER CTRL, I, movetoworkspace, e-1
bind = SUPER CTRL, U, movetoworkspace, e+1

bind = SUPER CTRL, down, movetoworkspace, e+1
bind = SUPER CTRL, up, movetoworkspace, e-1

bind = SUPER, Page_Down, workspace, e+1
bind = SUPER, Page_Up, workspace, e-1

bind = SUPER SHIFT, Page_Down, movetoworkspace, e+1
bind = SUPER SHIFT, Page_Up, movetoworkspace, e-1

# Multi-Monitor Management
bind = SUPER CTRL, F, resizeactive, exact 100%
bind = SUPER CTRL, H, focusmonitor, l
bind = SUPER CTRL, J, focusmonitor, d
bind = SUPER CTRL, K, focusmonitor, u
bind = SUPER CTRL, L, focusmonitor, r
bind = SUPER CTRL, left, focusmonitor, l
bind = SUPER CTRL, right, focusmonitor, r

bind = SUPER SHIFT CTRL, H, movewindow, mon:l
bind = SUPER SHIFT CTRL, J, movewindow, mon:d
bind = SUPER SHIFT CTRL, K, movewindow, mon:u
bind = SUPER SHIFT CTRL, L, movewindow, mon:r

bind = SUPER SHIFT CTRL, down, movewindow, mon:d
bind = SUPER SHIFT CTRL, left, movewindow, mon:l
bind = SUPER SHIFT CTRL, right, movewindow, mon:r
bind = SUPER SHIFT CTRL, up, movewindow, mon:u

# Window Resize
binde = SUPER, equal, resizeactive, 10% 0
binde = SUPER, minus, resizeactive, -10% 0
binde = SUPER SHIFT, minus, resizeactive, 0 -10%
binde = SUPER SHIFT, equal, resizeactive, 0 10%

# Move Window Focus
bind = SUPER, left, movefocus, l
bind = SUPER, down, movefocus, d
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u

bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

bind = SUPER, End, focuswindow, last
bind = SUPER, Home, focuswindow, first

# Move Window Position
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u

# Window Management with Mouse
bindmd = SUPER, mouse:272, Move window, movewindow # Left click
bindmd = SUPER, mouse:273, Resize window, resizewindow # Right click

# Process List
bind = CTRL ALT, Delete, exec, kitty --class btop_float -e btop

# Rofi
bind = Super, D, exec, pkill rofi || ~/.config/rofi/launcher.sh # app
bind = SUPER, V, exec, pkill rofi || cliphist list | rofi -dmenu -display-columns 2 -p " 󰅍 " -theme ~/.config/rofi/style-2.rasi | cliphist decode | wl-copy # clipboard
bind = SUPER, Y, exec, pkill rofi || ~/.config/hypr/scripts/wallpaper-picker.sh # wallpaper
bind = SUPER, period, exec, pkill rofi || rofimoji --files all --action type copy --prompt " ⬢ " --selector-args="-theme ~/.config/rofi/style-2.rasi" # emoji

# Special Workspace/Minimized
bind = SUPER SHIFT, M, togglespecialworkspace, minimized
bind = SUPER, M, exec, ~/.config/hypr/scripts/toggle_minimized.sh

# Screenshot
bind = ALT, Print, exec, hyprshot -zm window
bind = CTRL, Print, exec, hyprshot -zm output
bind = Super Shift, S, exec, hyprshot -zm region
bind = , Print, exec, hyprshot -zm region

# Close window
bind = Super Shift, Q, killactive

# Notification Center/SwayNC
bind = SUPER, N, exec, swaync-client -t -sw

# File Manager/Thunar
bind = Super, E, exec, thunar

# Power Menu/Wlogout
bind = Super, Escape, exec, pkill wlogout || wlogout -b 5 -T 400 -B 400

# Terminal/Kitty
bind = Super, Return, exec, kitty

bind = SUPER SHIFT, E, exit

# Turn off monitor/Power Saver
bind = SUPER SHIFT, P, dpms, toggle

# Toggle Fullscreen
bind = SUPER, F, fullscreen, 0

# Floating Window
bind = SUPER SHIFT, T, togglefloating

# Toggles Window into a Tabbed Group
bind = SUPER, W, togglegroup

# Pre-select Window Spawn Position
bind = SUPER, bracketleft, layoutmsg, preselect l
bind = SUPER, bracketright, layoutmsg, preselect r

# Change Split Direction
bind = SUPER, R, layoutmsg, togglesplit

# On-screen Keyboard
bind = SUPER, K, exec, pkill wvkbd-mobintl || wvkbd-mobintl -L 400 -H 400

# Show/Hide Dock
bind = SUPER SHIFT, F, exec, pkill nwg-dock-hyprla || nwg-dock-hyprland -x -mb 2 -i 33 -w 5 -c "rofi -show drun -theme ~/.config/rofi/style-1.rasi" -lp start -ico /usr/share/pixmaps/archlinux-logo.svg

