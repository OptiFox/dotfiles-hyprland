source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = SF Display Pro Bold

$script = ~/.config/hypr/scripts/

# GENERAL
general {
  no_fade_in = false
  grace = 0
  disable_loading = false
  hide_cursor = false
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.cache/current_wallpaper
  blur_passes = 2
  color = $base
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 120
  font_family = $font
  position = 0, -100
  halign = center
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A - %d %B %Y"
  color = $text
  font_size = 12
  font_family = $font
  position = 0, -300
  halign = center
  valign = top
}

# FINGERPRINT
# {
#   monitor = "";
#   text = "$FPRINTPROMPT";
#   color = "$text";
#   font_size = 14;
#   font_family = $font;
#   position = "0, -107";
#   halign = "center";
#   valign = "center";
# }

# USER AVATAR
image {
  monitor =
  path = $HOME/Pictures/profile/pfp.png
  size = 70
  border_color = $accent
  border_size = 2
  position = 0, -320
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 40
  outline_thickness = 0
  font_family = $font
  rounding = 12
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = false
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha">Password                                                                  </span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = -30, -400
  halign = center
  valign = center
}

# --- AESTHETIC BUTTON (RIGHT OF INPUT) ---

# Button Background
shape {
    monitor =
    size = 40, 40
    color = $mauve
    rounding = 12
    border_size = 0
    position = 160, -400
    halign = center
    valign = center
}

# Button Icon (Inside the shape)
label {
    monitor =
    text = 󰅂
    color = $base
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 160, -400
    halign = center
    valign = center
}

# --- MINIMALIST MUSIC UNIT ---

# Background Capsule
shape {
    monitor =
    size = 360, 40
    color = rgba(30, 30, 46, 0.4)
    rounding = 12
    border_size = 1
    border_color = $accent
    position = 0, -450
    halign = center
    valign = center
}

# LEFT: CAVA Visualizer
label {
    monitor =
    text = cmd[update:100] ~/.config/hypr/scripts/cava.sh
    color = $accent
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -140, -450
    halign = center
    valign = center
}

# CENTER: Truncated Title
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/music.sh
    color = $text
    font_size = 11
    font_family = $font
    position = -20, -450
    halign = center
    valign = center
}

# RIGHT: Play/Pause Icon
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/music-status.sh
    color = $accent
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 155, -450
    halign = center
    valign = center
}