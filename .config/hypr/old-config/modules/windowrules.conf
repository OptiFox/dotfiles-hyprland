# ==================
# WINDOW RULES
# ==================

windowrule = rounding 12, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$

windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

windowrule = float on, match:class ^(zoom)$

windowrule = float on, match:class ^(nm-connection-editor)$

# Steam
windowrule = float on, match:class ^(steam)$
windowrule = center on, match:class ^(steam)$
windowrule = tile on, match:class ^(steam)$, match:title ^(Steam)$

# This catches the 'floating_nmtui' class defined in Eww
windowrule = float on, match:class ^(floating_nmtui)$
windowrule = size 800 800, match:class ^(floating_nmtui)$
windowrule = center on, match:class ^(floating_nmtui)$

windowrule = float on, match:class ^(blueman-manager)$
windowrule = size 800 800, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$

# Btop
windowrule = float on, match:class ^(btop_float)$
windowrule = size 1850 900, match:class ^(btop_float)$
windowrule = center on, match:class ^(btop_float)$

# Prism Launcher rules

## 1. GLOBAL FLOAT
windowrule = float on, match:class ^(org\.prismlauncher\.PrismLauncher)$
windowrule = float on, match:class ^([Mm]inecraft.*)$

## 2. MAIN WINDOW
windowrule = size 1080 720, match:class ^(org\.prismlauncher\.PrismLauncher)$, match:title ^(Prism Launcher.*)$
windowrule = center on, match:class ^(org\.prismlauncher\.PrismLauncher)$, match:title ^(Prism Launcher.*)$

## 3. THE "PLEASE WAIT" POPUP
windowrule = size 450 150, match:class ^(org\.prismlauncher\.PrismLauncher)$, match:title ^(Please wait.*)$
windowrule = center on, match:class ^(org\.prismlauncher\.PrismLauncher)$, match:title ^(Please wait.*)$
windowrule = opaque on, match:class ^(org\.prismlauncher\.PrismLauncher)$, match:title ^(Please wait.*)$

## 4. EDIT/CONSOLE/SETTINGS
windowrule = size 800 500, match:class ^(org\.prismlauncher\.PrismLauncher)$, match:title 2
windowrule = center on, match:class ^(org\.prismlauncher\.PrismLauncher)$, match:title ^(Edit Instance|Console|Settings).*$

# Firefox
windowrule = float on, match:class ^(firefox)$ match:title ^(Library)$
windowrule = center on, match:class ^(firefox)$, match:title ^(Library)$
windowrule = size 800 500, match:class ^(firefox)$, match:title ^(Library)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$

# Thunar
windowrule = opacity 0.95 override 0.85 override, match:class ^(thunar)$
layerrule = blur on, match:class ^(thunar)$

# VSCodium
windowrule = opacity 0.95 override 0.85 override, match:class ^(codium)$
layerrule = blur on, match:class ^(codium)$

# Wlogout
layerrule = blur on, match:namespace ^(logout_dialog)$
layerrule = ignore_alpha 0.5, match:namespace ^(logout_dialog)$

# SwayNC Control Center
layerrule = blur on, match:namespace ^(swaync-control-center)
layerrule = ignore_alpha 0.5, match:namespace ^(swaync-control-center)
layerrule = animation slide right, match:namespace ^(swaync-control-center)

# SwayNC Notifications Popup
layerrule = blur on, match:namespace ^(swaync-notification-window)
layerrule = ignore_alpha 0.5, match:namespace ^(swaync-notification-window)
layerrule = animation slide right, match:namespace ^(swaync-notification-window)

# EWW Animation
layerrule = animation slide right, match:namespace ^(gtk-layer-shell)

# Waybar
layerrule = blur on, match:class ^(waybar)
layerrule = ignore_alpha 0.5, match:class ^(waybar)

# Dock
layerrule = blur on, match:class ^(nwg-dock-hyprland)
layerrule = ignore_alpha 0.5, match:class ^(nwg-dock-hyprland)

# Rofi
layerrule = blur on, match:namespace ^(rofi)
layerrule = ignore_alpha 0.2, match:namespace ^(rofi)
layerrule = animation popin 80%, match:namespace ^(rofi)
