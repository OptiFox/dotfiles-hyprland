# ==================
# STARTUP APPS
# ==================

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprland-session.target
exec-once = sh -c "sleep 5 && vesktop --start-minimized"
exec-once = sleep 2 && swaync &
exec-once = awww-daemon
exec-once = waybar
exec-once = eww daemon
exec-once = sleep 2 && swayosd-server
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = wl-clip-persist --clipboard regular
#exec-once = nwg-dock-hyprland -x -mb 2 -i 33 -w 5 -c "rofi -show drun -theme ~/.config/rofi/style-1.rasi" -lp start -ico /usr/share/pixmaps/archlinux-logo.svg
exec-once = nm-applet
exec-once = antimicrox --hidden
exec-once = gsr-ui
exec-once = /usr/lib/polkit-kde-authentication-agent-1
