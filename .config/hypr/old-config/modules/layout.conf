# ==================
# GENERAL LAYOUT
# ==================

general {
    #gaps_in = 5
    gaps_out = 5
    gaps_in = 2
    #gaps_out = 0
    border_size = 2

    layout = dwindle
}

# Force workspaces 1-5 to persist even when empty
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

# ==================
# DECORATION
# ==================

decoration {
    #rounding = 6

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 5
        color = rgba(00000070)
    }

    blur {
        enabled = true
        size = 15
        passes = 2
        
        ignore_opacity = true
        noise = 0.02
        contrast = 1.5

        new_optimizations = true
        xray = false

        popups = false
        popups_ignorealpha = 1.0
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default

    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = snappy, 0.4, 0.0, 0.2, 1.0
    bezier = smoothOut, 0.36, 0, 0.66, -0.56

    animation = layersIn, 1, 4, overshot

    animation = layersOut, 1, 3, smoothOut

    animation = fadeLayersIn, 1, 3, snappy
    animation = fadeLayersOut, 1, 3, smoothOut
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

scrolling {
    column_width = 0.667
    focus_fit_method = 1
    follow_min_visible = 1.0
    explicit_column_widths = 0.334, 0.5, 0.667, 1.0
}
